name: Build and release HexDex

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version increment: patch (fixes), minor (features), major (breaking changes)'
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

concurrency:
  # Serialize releases across branches so two runs cannot choose the same version.
  group: hexdex-release
  cancel-in-progress: false

jobs:
  version:
    name: Calculate release version
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out source and all tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Calculate next semantic version
        id: version
        shell: python3 {0}
        env:
          VERSION_BUMP: ${{ inputs.bump }}
        run: |
          import os
          import re
          import subprocess
          from pathlib import Path

          def next_version(tags, bump):
              versions = []
              for tag in tags:
                  match = re.fullmatch(r'v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)', tag)
                  if match:
                      versions.append(tuple(map(int, match.groups())))
              major, minor, patch = max(versions, default=(0, 0, 0))
              if bump == 'major':
                  major, minor, patch = major + 1, 0, 0
              elif bump == 'minor':
                  minor, patch = minor + 1, 0
              elif bump == 'patch':
                  patch += 1
              else:
                  raise ValueError(f'Unknown version increment: {bump}')
              return f'{major}.{minor}.{patch}'

          tags = subprocess.check_output(['git', 'tag', '--list'], text=True).splitlines()
          version = next_version(tags, os.environ['VERSION_BUMP'])
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as output:
              output.write(f'version={version}\ntag=v{version}\n')
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as summary:
              summary.write(f'## Release version\n\nBuilding **v{version}**.\n')
          print(f'Next release: v{version}')

  build:
    needs: version
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-2022
            architecture: x64
          - target: linux-x64
            runner: ubuntu-22.04
            architecture: x64
          - target: macos-arm64
            runner: macos-15
            architecture: arm64

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: ${{ matrix.architecture }}
          cache: pip

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0 libegl1 libopengl0 libnss3 libasound2

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pyinstaller>=6.11,<7" pillow
          python -m pip check

      - name: Check source and build environment
        shell: python
        env:
          BUILD_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          import ast
          import os
          import platform
          from pathlib import Path

          expected = os.environ['BUILD_ARCHITECTURE']
          actual = platform.machine().lower()
          allowed = {'x64': {'amd64', 'x86_64'}, 'arm64': {'arm64', 'aarch64'}}
          if actual not in allowed[expected]:
              raise RuntimeError(f'Expected {expected}, got {actual}')
          for filename in ('app.py', 'launch.py'):
              ast.parse(Path(filename).read_text(encoding='utf-8'))
          for filename in ('templates/index.html', 'assets/icons/hexdex_icon.ico'):
              if not Path(filename).is_file():
                  raise FileNotFoundError(filename)
          import tkinter
          from PyQt6 import QtWebEngineWidgets, QtWebChannel
          print(f'Build environment ready: {platform.system()} {actual}')

      - name: Build application
        shell: python
        run: |
          import subprocess
          import sys

          # Mirrors Meta/HexDex.spec; the ignored Meta folder is not needed in CI.
          command = [
              sys.executable, '-m', 'PyInstaller',
              '--noconfirm', '--clean', '--onedir', '--windowed',
              '--name', 'HexDex',
              '--specpath', 'build',
              '--add-data', 'templates:templates',
              '--hidden-import', 'webview.platforms.qt',
              '--hidden-import', 'PyQt6.QtWebEngineWidgets',
              '--hidden-import', 'PyQt6.QtWebChannel',
              '--hidden-import', 'tkinter',
              '--hidden-import', 'tkinter.filedialog',
              '--collect-data', 'webview',
          ]
          if sys.platform == 'win32':
              command += ['--icon', 'assets/icons/hexdex_icon.ico']
          elif sys.platform == 'darwin':
              # Convert the Windows icon for the macOS app bundle.
              from PIL import Image
              from pathlib import Path
              Path('build').mkdir(exist_ok=True)
              with Image.open('assets/icons/hexdex_icon.ico') as image:
                  image.save('build/hexdex.icns', format='ICNS')
              command += ['--icon', 'build/hexdex.icns', '--target-arch', 'arm64']
          command += ['launch.py']
          subprocess.run(command, check=True)

      - name: Verify and package application
        shell: python
        env:
          BUILD_TARGET: ${{ matrix.target }}
          BUILD_VERSION: ${{ needs.version.outputs.version }}
        run: |
          import os
          import shutil
          import subprocess
          import sys
          import tarfile
          from pathlib import Path

          target = os.environ['BUILD_TARGET']
          version = os.environ['BUILD_VERSION']
          output = Path('dist/packages')
          output.mkdir(parents=True, exist_ok=True)
          if sys.platform == 'darwin':
              bundle = Path('dist/HexDex.app')
              executable = bundle / 'Contents/MacOS/HexDex'
              templates = bundle / 'Contents/Resources/templates/index.html'
          else:
              bundle = Path('dist/HexDex')
              executable = bundle / ('HexDex.exe' if sys.platform == 'win32' else 'HexDex')
              templates = bundle / '_internal/templates/index.html'
          for required in (executable, templates):
              if not required.is_file():
                  raise FileNotFoundError(required)
          if sys.platform == 'darwin':
              architectures = subprocess.check_output(
                  ['lipo', '-archs', str(executable)], text=True
              ).strip()
              if architectures != 'arm64':
                  raise RuntimeError(f'Unexpected macOS architectures: {architectures}')
              # ditto preserves app-bundle symlinks and macOS metadata.
              subprocess.run([
                  'ditto', '-c', '-k', '--sequesterRsrc', '--keepParent',
                  str(bundle), str(output / f'HexDex-v{version}-{target}.zip'),
              ], check=True)
          elif sys.platform == 'win32':
              shutil.make_archive(str(output / f'HexDex-v{version}-{target}'), 'zip',
                                  root_dir='dist', base_dir='HexDex')
          else:
              # tar preserves executable permissions and bundled symlinks.
              with tarfile.open(output / f'HexDex-v{version}-{target}.tar.gz', 'w:gz') as archive:
                  archive.add(bundle, arcname='HexDex')

      - name: Upload downloadable package
        uses: actions/upload-artifact@v7
        with:
          name: HexDex-v${{ needs.version.outputs.version }}-${{ matrix.target }}
          path: dist/packages/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: Publish GitHub Release
    # The default success condition requires all three builds to succeed.
    needs: [version, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Download all platform packages
        uses: actions/download-artifact@v7
        with:
          pattern: HexDex-v${{ needs.version.outputs.version }}-*
          path: release-assets
          merge-multiple: true

      - name: Publish complete release
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          version = os.environ['RELEASE_VERSION']
          tag = os.environ['RELEASE_TAG']
          commit = os.environ['RELEASE_COMMIT']
          assets_dir = Path('release-assets')
          packages = [assets_dir / f'HexDex-v{version}-{target}{extension}' for target, extension in (
              ('windows-x64', '.zip'), ('linux-x64', '.tar.gz'), ('macos-arm64', '.zip'),
          )]
          for package in packages:
              if not package.is_file() or package.stat().st_size == 0:
                  raise FileNotFoundError(f'Missing or empty package: {package}')
          checksums = assets_dir / 'SHA256SUMS.txt'
          with checksums.open('w', encoding='utf-8') as output:
              for package in packages:
                  digest = hashlib.sha256()
                  with package.open('rb') as source:
                      for chunk in iter(lambda: source.read(1024 * 1024), b''):
                          digest.update(chunk)
                  output.write(f'{digest.hexdigest()}  {package.name}\n')
          assets = [str(package) for package in packages] + [str(checksums)]
          marker = f'<!-- HexDex release run {os.environ["GITHUB_RUN_ID"]}, commit {commit} -->'
          existing = subprocess.run(
              ['gh', 'release', 'view', tag, '--json', 'body,isDraft,url'],
              capture_output=True, text=True,
          )
          if existing.returncode == 0:
              release = json.loads(existing.stdout)
              if marker not in release['body']:
                  raise RuntimeError(f'{tag} already exists and belongs to another run; refusing to overwrite it')
              if not release['isDraft']:
                  print(f'Release already published: {release["url"]}')
              else:
                  # A failed publish can resume its own draft without altering a published release.
                  subprocess.run(['gh', 'release', 'upload', tag, *assets, '--clobber'], check=True)
                  subprocess.run(['gh', 'release', 'edit', tag, '--draft=false', '--latest'], check=True)
          else:
              # Reject an existing tag, even if it has no release. Never retag a version.
              ref = subprocess.run(
                  ['gh', 'api', f'repos/{os.environ["GH_REPO"]}/git/ref/tags/{tag}'],
                  capture_output=True, text=True,
              )
              if ref.returncode == 0:
                  raise RuntimeError(f'Tag {tag} already exists; refusing to reuse it')
              # Publish only after every asset has uploaded successfully to the draft.
              subprocess.run([
                  'gh', 'release', 'create', tag, *assets, '--draft',
                  '--target', commit, '--title', f'HexDex {tag}',
                  '--notes', marker, '--generate-notes',
              ], check=True)
              subprocess.run(['gh', 'release', 'edit', tag, '--draft=false', '--latest'], check=True)
          url = subprocess.check_output(['gh', 'release', 'view', tag, '--json', 'url', '--jq', '.url'], text=True).strip()
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as summary:
              summary.write(f'## Release published\n\n[Download HexDex {tag}]({url})\n')
