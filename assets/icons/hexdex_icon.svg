<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- HexDex app icon master. A collection card on a red tile; the artwork window is a
       red hexagon holding a generic creature silhouette. Edit here, then run
       assets/make_assets.py to rebuild every icon format, the banner and the social card. -->
  <g transform="scale(10.24)">
    <rect width="100" height="100" rx="22" fill="#d42a42"/>
    <rect x="22" y="10" width="56" height="78" rx="9" fill="#141415"/>
    <polygon points="50,20 66.5,29.5 66.5,48.5 50,58 33.5,48.5 33.5,29.5" fill="#d42a42" stroke="#d42a42" stroke-width="4" stroke-linejoin="round"/>
    <g fill="#141415">
      <ellipse cx="50" cy="44" rx="9.5" ry="8.5"/>
      <ellipse cx="43.5" cy="34" rx="3.2" ry="5" transform="rotate(-20 43.5 34)"/>
      <ellipse cx="56.5" cy="34" rx="3.2" ry="5" transform="rotate(20 56.5 34)"/>
    </g>
    <rect x="34" y="64" width="32" height="6" rx="3" fill="#ededed"/>
    <rect x="40" y="74" width="20" height="5" rx="2.5" fill="#ededed" fill-opacity="0.45"/>
  </g>
</svg>
